{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="main-section pt-5">
    <div class="page-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 col-md-8 col-sm-12 col-xs-12 mx-auto">
                    <div class="card" style="border: 2px solid #dc3545; border-radius: 10px;">
                        <div class="card-body text-center" style="padding: 40px;">
                            <h1 style="color: #dc3545; margin-bottom: 20px;">
                                <i class="fa fa-exclamation-circle" style="font-size: 60px;"></i>
                            </h1>
                            <h2 style="color: #dc3545; margin-bottom: 15px;">Payment Error</h2>
                            <p style="font-size: 16px; color: #666; margin-bottom: 20px;">
                                {{ message }}
                            </p>
                            
                            <div style="margin-top: 30px;">
                                <p style="color: #666; margin-bottom: 20px;">An error occurred while processing your payment. Please try again or contact support.</p>
                                <a href="{% url 'checkout' %}" class="btn btn-danger" style="margin-right: 10px;">
                                    <i class="fa fa-shopping-cart"></i> Try Again
                                </a>
                                <a href="{% url 'home' %}" class="btn btn-secondary">
                                    <i class="fa fa-home"></i> Back to Home
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
